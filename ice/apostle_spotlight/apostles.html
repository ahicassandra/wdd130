<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apostles Spotlights</title>
    <style>
        /* Insert styles here */
        body{
            background: tan;
        }

        #box {
        border: solid #002b5c 6px;
        width: 900px;
        border-radius: 50px;
        margin: 70px auto;
        padding: 60px;
        text-align: center;
        background-image: url("images/christus.webp");
        background-size: cover;
        background-position: center;
        }

        .spotlight{
            border: #fff 10px solid;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            overflow: hidden;
        }
        
        .spotlight img{
            width: 80px;
        }

        .first_pres{
            width: 100px;
            height: 100px;
        }

        .first_pres img{
            width: 100px;
        }

        .title {
            font-size: 32px;
            font-weight: bold;
            color: white;
        }

        .first-presidency {
            display: flex;
            justify-content: center;
            gap: 25px;
        }

        .apostles-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
            justify-items: center;
            margin-top: 30px;
        }

    </style>
</head>
<body>
    <!-- Insert HTML elements here -->
    <div id="box">
        <p class="title">First Presidency</p>

    <div class="spotlight first_pres">
        <img src="images/eyring.webp" alt="President Eyring">
    </div>

    <div class="spotlight">
        <img src="images/oaks.webp" alt="President Oaks">
    </div>
    
    <div class="spotlight">
        <img src="images/christofferson.webp" alt="President christofferson">
    </div>
        <p class="title">Quorum of the Twelve Apostles</p>
        
    <div class="apostles-grid"></div>

    <div class="spotlight">
        <img src="images/gilbert.webp" alt="Elder gilbert">
    </div>

    <div class="spotlight">
        <img src="images/causse.webp" alt="Elder causse">
    </div>

    <div class="spotlight">
        <img src="images/kearon.webp" alt="Elder kearon">
    </div>

    <div class="spotlight">
        <img src="images/soares.webp" alt="Elder soares">
    </div>

    <div class="spotlight">
        <img src="images/gong.webp" alt="Elder gong">
    </div>

    <div class="spotlight">
        <img src="images/renlund.webp" alt="Elder renlund">
    </div>
    
    <div class="spotlight">
        <img src="images/stevenson.webp" alt="Elder stevenson">
    </div>

    <div class="spotlight">
        <img src="images/rasband.webp" alt="Elder rasband">
    </div>
    
    <div class="spotlight">
        <img src="images/anderson.webp" alt="Elder anderson">
    </div>

    <div class="spotlight">
        <img src="images/cook.webp" alt="Elder cook">
    </div>

    <div class="spotlight">
        <img src="images/uchtdorf.webp" alt="Elder Uchtdorf">
    </div>

    <div class="spotlight">
        <img src="images/bednar.webp" alt="Elder Bednar">
    </div>

</div>
</body>
</html>
